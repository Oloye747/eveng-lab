name: EVE-NG Lab CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lab-test:
    runs-on: self-hosted
    timeout-minutes: 360

    defaults:
      run:
        shell: powershell
        working-directory: .

    env:
      TF_VAR_eveng_host: ${{ secrets.EVE_HOST }}
      TF_VAR_eveng_username: ${{ secrets.EVE_USERNAME }}
      TF_VAR_eveng_password: ${{ secrets.EVE_PASSWORD }}
      EVE_HOST: ${{ secrets.EVE_HOST }}
      EVE_USERNAME: ${{ secrets.EVE_USERNAME }}
      EVE_PASSWORD: ${{ secrets.EVE_PASSWORD }}
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      TF_LOG: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Output
        run: terraform output -no-color
